:root{
  --roxo1:#4b1fa8;--roxo2:#7b2ff7;--roxo3:#2a0f6b;--ouro:#ffcc1a;--ouro2:#ff9f0a;--verde:#2bd46b;--verde2:#14a34a;
  --vermelho:#ff4757;--vermelho2:#d0263a;--azul:#3d8bff;--papel:#fff8ec;--tinta:#2b1a4a;--tinta2:#5b4b7a;--linha:#e6dcf5;
  --painel:#ffffff;--sombra:0 6px 0 rgba(0,0,0,.18),0 10px 24px rgba(30,0,80,.25);
  --titulo:"Lilita","Arial Black","Segoe UI Black",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tinta);
  background:radial-gradient(1200px 700px at 50% -10%,#9b5cff 0,var(--roxo2) 30%,var(--roxo1) 60%,var(--roxo3) 100%) fixed;
  min-height:100%;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
@media(min-width:900px){.app{max-width:1000px}}
.topo{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(42,15,107,.95),rgba(42,15,107,.0))}
.topo .meio{flex:1;display:flex;justify-content:center}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:#fff;
  background:linear-gradient(180deg,#6d4dff,#3b1fb0);box-shadow:0 4px 0 #22106a,inset 0 2px 0 rgba(255,255,255,.3)}
.ico:active{transform:translateY(2px);box-shadow:0 2px 0 #22106a}
.ico.ouro{background:linear-gradient(180deg,#ffe066,#ffb703);color:#5a2d00;box-shadow:0 4px 0 #b86e00}
.logo{font-family:var(--titulo);text-align:center;line-height:.85;transform:rotate(-3deg);user-select:none}
.logo .l1{font-size:22px;color:#fff;-webkit-text-stroke:2px #2a0f6b;paint-order:stroke fill;letter-spacing:1px}
.logo .l2{font-size:34px;background:linear-gradient(180deg,#fff27a,#ffb703 60%,#ff7b00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #7a1b00) drop-shadow(0 0 1px #3b0a00)}
.logo .l3{display:inline-block;margin-top:4px;font-size:11px;letter-spacing:3px;color:#fff;background:linear-gradient(180deg,#ff5b6b,#c2142e);
  padding:3px 10px;border-radius:999px;border:2px solid #ffd34d}
.logo.grande .l1{font-size:46px}.logo.grande .l2{font-size:76px}.logo.grande .l3{font-size:18px;padding:5px 18px}
.tela{flex:1;padding:8px 14px 96px;display:none;animation:entra .25s ease}
.tela.ativa{display:block}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.painel{background:var(--papel);border-radius:26px;padding:18px;box-shadow:var(--sombra);margin:12px 0}
.painel.roxo{background:linear-gradient(180deg,#5a2fd0,#3c1a9e);color:#fff;border:2px solid rgba(255,255,255,.25)}
h1,h2,h3{font-family:var(--titulo);font-weight:400;margin:0 0 6px;letter-spacing:.3px}
h1{font-size:30px}h2{font-size:24px}h3{font-size:18px}
.centro{text-align:center}.sub{color:var(--tinta2);font-size:14px;margin:0 0 10px}
.painel.roxo .sub{color:#e6dcff}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 18px;border-radius:999px;
  font-family:var(--titulo);font-size:22px;letter-spacing:.4px;color:#3a1d00;
  background:linear-gradient(180deg,#ffe45c,#ffb703);box-shadow:0 6px 0 #c06a00,0 10px 18px rgba(0,0,0,.25);margin:10px 0;
  text-shadow:0 1px 0 rgba(255,255,255,.5);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #c06a00}
.btn.verde{background:linear-gradient(180deg,#5cf08f,#18b552);color:#063d1b;box-shadow:0 6px 0 #0b7a34,0 10px 18px rgba(0,0,0,.25)}
.btn.vermelho{background:linear-gradient(180deg,#ff7a85,#e3243b);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:0 6px 0 #8f0f20,0 10px 18px rgba(0,0,0,.25)}
.btn.azul{background:linear-gradient(180deg,#6d7dff,#3a3fc9);color:#fff;text-shadow:none;box-shadow:0 6px 0 #1f2380,0 10px 18px rgba(0,0,0,.25)}
.btn.claro{background:#fff;color:var(--roxo1);box-shadow:0 4px 0 #cbbcf0;border:2px solid #d9cdf7;font-size:19px}
.btn.peq{font-size:17px;padding:11px 14px}
.btn[disabled]{filter:grayscale(.8) opacity(.6);pointer-events:none}
.linha{display:flex;gap:10px;align-items:center}.linha>*{flex:1}
.jogadores{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.jog{background:#fff;border:3px solid #e2d7fb;border-radius:18px;padding:10px 2px;text-align:center;font-family:var(--titulo);color:var(--roxo1)}
.jog b{display:block;font-size:30px;line-height:1}.jog small{font-family:system-ui;font-size:11px;color:var(--tinta2)}
.jog.sel{background:linear-gradient(180deg,#7b4dff,#4b1fa8);color:#fff;border-color:#ffd34d;box-shadow:0 0 0 3px rgba(255,211,77,.4)}
.jog.sel small{color:#e8dcff}
.alternar{display:flex;background:#fff;border-radius:999px;padding:4px;gap:4px;box-shadow:inset 0 0 0 2px #e2d7fb}
.alternar button{flex:1;border-radius:999px;padding:9px 6px;background:transparent;color:var(--roxo1);font-weight:700;font-size:14px}
.alternar button.sel{background:linear-gradient(180deg,#ffe45c,#ffb703);color:#4a2500;box-shadow:0 2px 0 #c06a00}
.busca{width:100%;padding:12px 16px;border-radius:999px;border:2px solid #e2d7fb;background:#fff;margin:10px 0 4px;font-size:15px}
.aviso{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.12);color:#fff;border:2px dashed rgba(255,211,77,.7);
  border-radius:18px;padding:10px 12px;font-size:13px;margin:10px 0}
.aviso.claro{background:#f4efff;color:var(--tinta);border-color:#c9b6f5}
/* carrossel */
.carrossel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 18% 22px;margin:0 -14px;scrollbar-width:none}
.carrossel::-webkit-scrollbar{display:none}
.capa{flex:0 0 64%;scroll-snap-align:center;aspect-ratio:3/4.2;border-radius:22px;position:relative;overflow:hidden;color:#fff;
  box-shadow:0 8px 0 rgba(0,0,0,.25),0 14px 28px rgba(0,0,0,.35);border:4px solid #fff;background:#333;text-align:left;padding:0}
.capa img,.capa .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capa .rot{position:absolute;left:0;right:0;bottom:0;padding:40px 12px 12px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0))}
.capa .rot b{font-family:var(--titulo);font-weight:400;font-size:26px;display:block;line-height:1;text-shadow:0 2px 0 #000}
.capa .rot small{opacity:.9;font-size:12px}
.capa .qtd{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
.baixado{border-color:#ffd34d!important;box-shadow:0 0 0 3px rgba(255,211,77,.6),0 0 22px 6px rgba(255,221,90,.75),0 8px 0 rgba(0,0,0,.25)!important;
  animation:brilho 2.4s ease-in-out infinite}
@keyframes brilho{50%{box-shadow:0 0 0 3px rgba(255,211,77,.9),0 0 34px 12px rgba(255,236,140,.95),0 8px 0 rgba(0,0,0,.25)}}
.selo{position:absolute;top:38px;left:10px;background:linear-gradient(180deg,#ffe45c,#ffb703);color:#4a2500;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.grade .capa{flex:none;width:100%;aspect-ratio:1/1.05}
.grade .capa .rot b{font-size:17px}
.grade .capa .rot small{font-size:10.5px}
.lista{background:#fff;border-radius:20px;overflow:hidden;margin:12px 0;box-shadow:var(--sombra)}
.lista button{display:flex;width:100%;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--linha);text-align:left;color:var(--tinta)}
.lista button:last-child{border-bottom:0}
.lista .em{font-size:24px;width:38px;height:38px;display:grid;place-items:center;border-radius:12px}
.lista .nm{flex:1;font-weight:700}.lista .q{font-size:12px;background:#f0eaff;color:var(--roxo1);border-radius:999px;padding:3px 9px}
.lista button.baixado{animation:none;box-shadow:inset 6px 0 0 #ffcc1a!important;background:#fffbea}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:700;border:2px solid rgba(255,255,255,.25)}
.chip.sel{background:#fff;color:var(--roxo1)}
/* cartas */
.carta{position:relative;border-radius:22px;padding:8px;background:linear-gradient(160deg,#ffe066,#ffb703 40%,#ff8a00);
  box-shadow:0 8px 0 rgba(0,0,0,.25),0 16px 30px rgba(0,0,0,.35);color:var(--tinta);max-width:380px;margin:0 auto}
.carta .in{background:#fff;border-radius:16px;overflow:hidden}
.carta .cab{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#fff;background:linear-gradient(180deg,#e9324a,#b3122a)}
.carta .num{background:#fff;color:#b3122a;font-weight:900;border-radius:9px;padding:2px 7px;font-size:13px}
.carta .nome{flex:1;font-family:var(--titulo);font-size:21px;line-height:1.05}
.carta .foto{position:relative;aspect-ratio:16/11;background:#222}
.carta .foto img{width:100%;height:100%;object-fit:cover;display:block}
.carta .foto .subt{position:absolute;left:8px;bottom:8px;right:8px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000}
.carta .st{position:absolute;top:8px;right:8px;background:linear-gradient(180deg,#fff27a,#ffb703);color:#5a2000;font-family:var(--titulo);
  border-radius:10px;padding:3px 8px;font-size:13px;box-shadow:0 2px 0 #a35a00;transform:rotate(4deg)}
.attrs{padding:6px}
.attr{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin:4px 0;border-radius:12px;background:#f3eefc;color:var(--tinta);text-align:left;position:relative;overflow:hidden}
.attr .barra{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(123,47,247,.16),rgba(123,47,247,.05));pointer-events:none}
.attr .n{flex:1;font-weight:700;font-size:15px;position:relative}.attr .v{font-family:var(--titulo);font-size:19px;position:relative}
.attr .seta{font-size:11px;color:#b3122a;margin-left:4px;position:relative}
.attr.sel{background:linear-gradient(180deg,#ffe45c,#ffb703);box-shadow:0 0 0 3px #ff8a00;transform:scale(1.03)}
.attr.bloq{opacity:.45}
.attr.ganhou{background:#c9f7d8}.attr.perdeu{background:#ffd5da}
.carta .cred{font-size:9.5px;color:#8a7da3;padding:2px 10px 6px;line-height:1.2}
.carta.mini{max-width:none;padding:4px;border-radius:14px}
.carta.mini .in{border-radius:10px}.carta.mini .cab{padding:4px 6px}.carta.mini .nome{font-size:13px}.carta.mini .num{font-size:10px;padding:1px 4px}
.carta.mini .attr{padding:3px 6px;margin:2px 0;border-radius:7px}.carta.mini .attr .n{font-size:10px}.carta.mini .attr .v{font-size:12px}
.carta.mini .st{font-size:9px;padding:1px 5px}.carta.mini .cred,.carta.mini .subt{display:none}
.mao{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 14px;scroll-snap-type:x proximity;scrollbar-width:thin}
.mao .carta{flex:0 0 132px;scroll-snap-align:start;cursor:pointer;transition:transform .15s}
.mao .carta.sel{transform:translateY(-8px);box-shadow:0 0 0 4px #fff,0 0 0 8px #2bd46b,0 12px 20px rgba(0,0,0,.35)}
.placar{display:flex;gap:8px;overflow-x:auto;margin:6px 0}
.pj{flex:1;min-width:92px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 8px;color:#fff;font-size:12px}
.pj b{display:block;font-size:14px}.pj.vez{border-color:#ffd34d;background:rgba(255,211,77,.22)}.pj.fora{opacity:.4;text-decoration:line-through}
.barra-topo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;margin:4px 0}
.pill{background:rgba(0,0,0,.25);border-radius:999px;padding:5px 12px;font-size:13px;color:#fff}
.pontos{display:flex;gap:4px}.pontos i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}.pontos i.on{background:#ffd34d}
.campo{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:inset 0 0 0 2px #e2d7fb}
.campo label{flex:1;font-weight:700;font-size:14px}
.campo input,.campo select{width:110px;padding:9px 10px;border-radius:12px;border:2px solid #d9cdf7;font-size:16px;text-align:center;background:#faf8ff}
.campo input[type=range]{width:150px;padding:0}
.campo input.largo{width:100%;text-align:left}
.res{position:relative;text-align:center;padding:16px 8px 6px;color:#fff}
.res .grande{font-family:var(--titulo);font-size:42px;line-height:.95;-webkit-text-stroke:2px rgba(0,0,0,.35);paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.res.ganhou .grande{color:#fff;background:linear-gradient(180deg,#2bd46b,#0b9a3f);display:inline-block;padding:10px 20px;border-radius:20px;transform:rotate(-2deg)}
.res.perdeu .grande{background:linear-gradient(180deg,#ff6b6b,#d0263a);display:inline-block;padding:10px 20px;border-radius:20px;transform:rotate(-2deg)}
.res.empate .grande{background:linear-gradient(180deg,#ffe45c,#ffb703);color:#4a2500;display:inline-block;padding:10px 20px;border-radius:20px}
.emoji-g{font-size:64px;line-height:1;margin-bottom:6px;animation:pula 1s ease infinite alternate}
@keyframes pula{to{transform:translateY(-6px) scale(1.05)}}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.versus.multi{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.vs{font-family:var(--titulo);font-size:36px;color:#ffd34d;-webkit-text-stroke:2px #7a1b00;paint-order:stroke fill}
.etq{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;margin:0 auto 6px;background:#fff;color:var(--roxo1)}
.etq.v{background:#2bd46b;color:#053;}.etq.p{background:#ff4757;color:#fff}
.comp{display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.25);border-radius:18px;padding:10px;color:#fff;margin:12px 0;flex-wrap:wrap}
.comp b{font-family:var(--titulo);font-size:22px;background:#fff;color:var(--tinta);border-radius:12px;padding:4px 12px}
.comp b.win{background:#2bd46b;color:#053}
.resumo .lin{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--linha);font-weight:600}
.resumo .lin:last-child{border:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav .in{pointer-events:auto;width:100%;max-width:560px;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#5530c9,#2f1290);border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.3)}
.nav button{background:none;color:#d9ccff;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:4px 6px;min-width:58px}
.nav button .i{font-size:22px}
.nav button.sel{color:#ffd34d}
.nav button.jogar{background:linear-gradient(180deg,#ffe45c,#ffb703);color:#4a2500;border-radius:18px;padding:8px 14px;margin-top:-18px;box-shadow:0 5px 0 #c06a00;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(15,0,40,.7);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:12px}
.modal.ativo{display:flex}
@media(min-width:600px){.modal{align-items:center}}
.modal .caixa{background:var(--papel);border-radius:26px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--sombra);animation:entra .2s}
.modal .cab{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid var(--linha)}
.modal .cab h2{flex:1;margin:0}
.fechar{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#ff6b7a,#d0263a);color:#fff;font-size:22px;font-weight:900;box-shadow:0 3px 0 #8f0f20}
.modal .corpo{overflow-y:auto;padding:14px 16px 18px}
.regra{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.regra .nn{flex:none;width:30px;height:30px;border-radius:10px;background:var(--roxo2);color:#fff;font-family:var(--titulo);display:grid;place-items:center;font-size:18px}
.regra p{margin:2px 0;font-size:15px;line-height:1.35}
.progresso{height:14px;background:#e9e0fb;border-radius:999px;overflow:hidden;margin:10px 0}
.progresso i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2bd46b,#ffd34d);transition:width .2s}
.qi{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d0b4d;color:#fff;padding:10px 16px;border-radius:14px;z-index:60;
  box-shadow:0 6px 18px rgba(0,0,0,.4);font-size:14px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}
.cands button{padding:0;border-radius:12px;overflow:hidden;background:#eee;position:relative;aspect-ratio:1/1;border:3px solid transparent}
.cands button img{width:100%;height:100%;object-fit:cover}
.cands button.sel{border-color:#2bd46b}
.cands small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:2px 4px;text-align:left}
.coleta{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid var(--linha)}
.coleta img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#ddd;flex:none}
.coleta .nm{flex:1;font-weight:700;font-size:14px}.coleta .nm small{display:block;font-weight:400;color:var(--tinta2)}
.qr{background:#fff;padding:14px;border-radius:18px;display:grid;place-items:center;margin:10px auto;max-width:280px}
.qr svg{width:100%;height:auto}
.chk{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--linha)}
.chk input{width:22px;height:22px}
.chk span{flex:1;font-weight:600}
.oculto{display:none!important}
.pequeno{font-size:12px;color:var(--tinta2)}
a{color:var(--roxo2)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topo">
    <button class="ico" id="b-home" title="Início" aria-label="Início">🏠</button>
    <button class="ico ouro" id="b-qr" title="QR Code para baixar o jogo" aria-label="QR Code">▦</button>
    <div class="meio"><div class="logo" id="logo-topo"><div class="l1">SUPER</div><div class="l2">TRUNFO</div><div class="l3">OFFLINE</div></div></div>
    <button class="ico" id="b-share" title="Compartilhar sem internet (Bluetooth)" aria-label="Compartilhar">📲</button>
    <button class="ico" id="b-cfg" title="Configurações" aria-label="Configurações">⚙️</button>
  </header>
  <main id="telas">
    <section class="tela" id="t-inicio"></section>
    <section class="tela" id="t-baralhos"></section>
    <section class="tela" id="t-modo"></section>
    <section class="tela" id="t-jogo"></section>
    <section class="tela" id="t-rodada"></section>
    <section class="tela" id="t-fim"></section>
    <section class="tela" id="t-cfg"></section>
    <section class="tela" id="t-share"></section>
    <section class="tela" id="t-coletor"></section>
  </main>
  <nav class="nav"><div class="in">
    <button data-ir="inicio"><span class="i">🏠</span>Início</button>
    <button data-ir="baralhos"><span class="i">🃏</span>Baralhos</button>
    <button data-ir="jogar" class="jogar"><span class="i">▶</span>Jogar</button>
    <button data-ir="regras"><span class="i">📖</span>Regras</button>
    <button data-ir="cfg"><span class="i">⚙️</span>Config.</button>
  </div></nav>
</div>

<script id="st-app">/* Super Trunfo Offline — jogo de cartas de comparar atributos.
   Um arquivo só: funciona hospedado (GitHub Pages), aberto do disco ou recebido por Bluetooth. */
'use strict';
const PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML.replace(/<script type="application\/json" id="st-pack">[\s\S]*?<\/script>/, '');
const NOME_JOGO = 'Super Trunfo Offline';
const LINK_PADRAO = 'https://github.com/SEU-USUARIO/super-trunfo-offline/releases/latest/download/super-trunfo-offline.zip';

/* ---------------- utilidades ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('st.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('st.' + k, JSON.stringify(v)); } catch (e) { } }
};
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms); }
function fmt(v, u) {
  if (v == null) return '—';
  const a = Math.abs(v); let s;
  const nf = (x, d) => x.toLocaleString('pt-BR', { maximumFractionDigits: d });
  if (u === 'ano') s = v < 0 ? nf(-v, 0) + ' a.C.' : String(v);
  else if (a >= 1e12) s = nf(v / 1e12, 1) + ' tri';
  else if (a >= 1e9) s = nf(v / 1e9, 1) + ' bi';
  else if (a >= 1e6) s = nf(v / 1e6, 1) + ' mi';
  else if (a >= 1e4) s = nf(v, 0);
  else if (a >= 100) s = nf(v, 0);
  else if (a >= 1) s = nf(v, 1);
  else if (a === 0) s = '0';
  else s = v.toLocaleString('pt-BR', { maximumSignificantDigits: 2 });
  if (!u || u === 'ano') return s;
  if (u.startsWith('/')) return s + u;

}

function shuffle(arr, rnd = Math.random) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const online = () => location.protocol.startsWith('http');

/* ---------------- banco no aparelho (IndexedDB) ---------------- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      let r; try { r = indexedDB.open('super-trunfo-offline', 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('decks'); d.createObjectStore('imgs'); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async op(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => { const tx = d.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); });
  },
  get(s, k) { return this.op(s, 'readonly', st => st.get(k)); },
  put(s, k, v) { return this.op(s, 'readwrite', st => st.put(v, k)); },
  del(s, k) { return this.op(s, 'readwrite', st => st.delete(k)); },
  keys(s) { return this.op(s, 'readonly', st => st.getAllKeys()); },
  async delPrefix(s, p) { const ks = (await this.keys(s)).filter(k => String(k).startsWith(p)); for (const k of ks) await this.del(s, k); }
};
const dbOk = (async () => { try { await DB.open(); return true; } catch (e) { return false; } })();

/* ---------------- catalogo e baralhos ---------------- */
let CATALOGO = [];
const BAIXADOS = new Set();
const DECKS = {};           // id -> deck carregado
const pendentes = {};
window.STDeck = d => { DECKS[d.id] = d; prep(d); (pendentes[d.id] || []).forEach(f => f(d)); delete pendentes[d.id]; };
function scriptLoad(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function prep(d) {
  d.sorted = d.attrs.map((a, i) => d.cards.map(c => c.v[i]).filter(x => x != null).sort((x, y) => x - y));
  d.worth = d.cards.map(c => { let s = 0, n = 0; c.v.forEach((x, i) => { const p = pct(d, i, x); if (p != null) { s += p; n++; } }); return n ? s / n : 0; });
}
function pct(d, i, x) { // 0..1, 1 = melhor
  if (x == null) return null; const a = d.sorted[i]; if (a.length < 2) return .5;
  let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < x) lo = m + 1; else hi = m; }
  let eq = lo; while (eq < a.length && a[eq] === x) eq++;

  return d.attrs[i].hi ? p : 1 - p;
}
async function carregarDeck(id) {
  if (DECKS[id]) return DECKS[id];
  if (await dbOk) { const s = await DB.get('decks', id).catch(() => null); if (s) { STDeck(s.deck); return DECKS[id]; } }
  const p = new Promise(r => (pendentes[id] = pendentes[id] || []).push(r));
  await scriptLoad('decks/' + id + '.js');
  return p;
}
async function iniciarCatalogo() {
  try { await scriptLoad('decks/catalogo.js'); CATALOGO = window.ST_CATALOGO || []; } catch (e) { CATALOGO = []; }
  if (await dbOk) for (const k of await DB.keys('decks').catch(() => [])) BAIXADOS.add(k);
  const pack = $('#st-pack');
  if (pack) { try { await importarPacote(JSON.parse(pack.textContent), true); } catch (e) { console.warn(e); } }
  if (await dbOk) {
    const ks = await DB.keys('decks').catch(() => []);
    for (const k of ks) {
      BAIXADOS.add(k);
      if (!CATALOGO.find(c => c.id === k)) { const s = await DB.get('decks', k); if (s && s.meta) CATALOGO.push(s.meta); }
    }
  }
}
function metaDe(d) { return { id: d.id, nome: d.nome, grupo: d.grupo, emoji: d.emoji, cor: d.cor, qtd: d.cards.length, capa: null, attrs: d.attrs.map(a => a.n), fonte: d.fonte || '' }; }
function limpo(d) { const { sorted, worth, ...r } = d; return r; }

/* ---------------- imagens ---------------- */
const urlCache = {};
function placeholder(d, c) {
  const ini = (c.nome || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const cor = d.cor || '#6d28d9';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${cor}"/><stop offset="1" stop-color="#1a0b3d"/></linearGradient>
  <pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.6" fill="#fff" opacity=".15"/></pattern></defs>
  <rect width="320" height="220" fill="url(#g)"/><rect width="320" height="220" fill="url(#p)"/>
  <text x="160" y="118" font-size="96" text-anchor="middle" dominant-baseline="middle" opacity=".35">${d.emoji || '★'}</text>
  <text x="160" y="125" font-family="Arial Black,Arial" font-weight="900" font-size="64" fill="#fff" text-anchor="middle" dominant-baseline="middle" stroke="#000" stroke-opacity=".25" stroke-width="4" paint-order="stroke">${esc(ini)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
async function urlImagem(d, c) {
  const k = d.id + '/' + c.n;
  if (urlCache[k]) return urlCache[k];
  if (await dbOk) {
    const r = await DB.get('imgs', k).catch(() => null);
    if (r && r.blob) return urlCache[k] = URL.createObjectURL(r.blob);
    if (r && r.url) return urlCache[k] = r.url;
  }
  if (c.img && c.img.startsWith('decks/')) return c.img;
  if (c.img && c.img.startsWith('data:')) return c.img;
  return placeholder(d, c);
}
function hidratar(el) {
  $$('img[data-k]', el).forEach(async im => {
    const [id, n] = im.dataset.k.split('/'); const d = DECKS[id]; if (!d) return;
    const c = d.cards[n - 1]; im.src = await urlImagem(d, c);
    im.onerror = () => { im.onerror = null; im.src = placeholder(d, c); };
  });
}
async function resolverWiki(titulo) {
  const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(titulo.replace(/ /g, '_')), { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error('wiki ' + r.status);
  const j = await r.json(); const im = j.thumbnail || j.originalimage; if (!im) throw new Error('sem imagem');
  let url = im.source;
  if (!/\/wikipedia\/commons\//.test(url)) throw new Error('imagem não livre');
  if (/\/\d+px-/.test(url) && (j.originalimage?.width || 0) > 480) url = url.replace(/\/\d+px-/, '/480px-');
  const m = url.match(/\/commons\/(?:thumb\/)?[0-9a-f]\/[0-9a-f]{2}\/([^/]+)/); const file = m ? decodeURIComponent(m[1]) : '';
  let cred = 'Wikimedia Commons', lic = '';
  try {
    const q = await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=extmetadata&titles=File:' + encodeURIComponent(file));
    const jj = await q.json(); const p = Object.values(jj.query.pages)[0]; const md = p.imageinfo[0].extmetadata;
    const tx = s => (s || '').replace(/<[^>]+>/g, '').trim();
    cred = `${tx(md.Artist?.value) || 'Autor desconhecido'}, ${tx(md.LicenseShortName?.value)}, via Wikimedia Commons`; lic = md.LicenseUrl?.value || '';
  } catch (e) { }
  return { url, cred, lic, pagina: 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(file) };
}
async function baixarBlob(url) {
  const r = await fetch(url, { mode: 'cors' }); if (!r.ok) throw new Error('http ' + r.status);
  return await r.blob();
}
async function fonteImagem(c) {
  if (!c.img) return null;
  if (c.img.startsWith('wiki:')) return await resolverWiki(c.img.slice(5));
  if (c.img.startsWith('lol:')) return { url: 'https://ddragon.leagueoflegends.com/cdn/img/champion/loading/' + c.img.slice(4) + '_0.jpg', cred: c.cred || 'Riot Games', lic: '' };
  if (c.img.startsWith('decks/') || c.img.startsWith('http')) return { url: c.img, cred: c.cred || '', lic: c.lic || '' };
  return null;
}

/* ---------------- baixar baralho para o aparelho ("pastinha") ---------------- */
async function baixarBaralho(id, onProg) {
  const d = await carregarDeck(id);
  if (!(await dbOk)) { toast('Este navegador não permite guardar dados. O baralho funciona enquanto a página estiver aberta.'); return d; }
  let feito = 0, falhas = 0; const tot = d.cards.length;
  const fila = d.cards.slice();
  async function trab() {
    while (fila.length) {
      const c = fila.shift(); const k = d.id + '/' + c.n;
      try {
        const ja = await DB.get('imgs', k);
        if (!ja) {
          const f = await fonteImagem(c);
          if (f) {
            try { const blob = await baixarBlob(f.url); await DB.put('imgs', k, { blob, cred: f.cred, lic: f.lic, src: f.url }); }
            catch (e) { if (!f.url.startsWith('decks/')) await DB.put('imgs', k, { url: f.url, cred: f.cred, lic: f.lic, src: f.url }); else falhas++; }
          }
        }
      } catch (e) { falhas++; }
      feito++; onProg && onProg(feito / tot);
    }
  }
  await Promise.all([trab(), trab(), trab(), trab()]);
  const meta = CATALOGO.find(c => c.id === id) || metaDe(d);
  await DB.put('decks', id, { deck: limpo(d), meta, em: Date.now() });
  BAIXADOS.add(id);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  return d;
}
async function apagarBaralho(id) {
  await DB.del('decks', id); await DB.delPrefix('imgs', id + '/');
  Object.keys(urlCache).filter(k => k.startsWith(id + '/')).forEach(k => delete urlCache[k]);
  BAIXADOS.delete(id);
}
async function tamanhoBaralho(id) {
  let t = 0; const ks = (await DB.keys('imgs')).filter(k => String(k).startsWith(id + '/'));
  for (const k of ks) { const r = await DB.get('imgs', k); if (r && r.blob) t += r.blob.size; }
  const s = await DB.get('decks', id); t += JSON.stringify(s || {}).length; return t;
}

function qrSVG(txt) {
  const q = qrcode(0, 'M'); q.addData(txt); q.make();
  return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
}

/* ---------------- compartilhar sem internet ---------------- */
function blobParaDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function imagemComoDataURL(d, c) {
  const k = d.id + '/' + c.n; const r = await DB.get('imgs', k).catch(() => null);
  if (r && r.blob) return { img: await blobParaDataURL(r.blob), cred: r.cred || c.cred || '' };
  if (c.img && c.img.startsWith('decks/')) { try { return { img: await blobParaDataURL(await baixarBlob(c.img)), cred: c.cred || '' }; } catch (e) { } }
  if (r && r.url) return { img: r.url, cred: r.cred };
  return { img: c.img && (c.img.startsWith('wiki:') || c.img.startsWith('lol:')) ? c.img : null, cred: c.cred || '' };
}
async function montarPacote(ids, onProg) {
  const decks = []; let k = 0, tot = 0;
  for (const id of ids) tot += (await carregarDeck(id)).cards.length;
  for (const id of ids) {
    const d = await carregarDeck(id); const cp = JSON.parse(JSON.stringify(limpo(d)));
    for (const c of cp.cards) { const r = await imagemComoDataURL(d, c); c.img = r.img; c.cred = r.cred; k++; onProg && onProg(k / tot); }
    decks.push({ deck: cp, meta: CATALOGO.find(c => c.id === id) || metaDe(d) });
  }
  return { tipo: 'super-trunfo-pacote', versao: 1, criado: new Date().toISOString(), decks };
}
async function importarPacote(pk, silencioso) {
  if (!pk || pk.tipo !== 'super-trunfo-pacote') throw new Error('arquivo não é um pacote de baralhos');
  const ok = await dbOk; let n = 0;
  for (const { deck, meta } of pk.decks) {
    const m = Object.assign({}, meta, { capa: null });
    if (!CATALOGO.find(c => c.id === deck.id)) CATALOGO.push(m);
    if (ok && BAIXADOS.has(deck.id) && silencioso) continue;
    const cards = deck.cards;
    if (ok) {
      for (const c of cards) {
        if (c.img && c.img.startsWith('data:')) { const b = await (await fetch(c.img)).blob(); await DB.put('imgs', deck.id + '/' + c.n, { blob: b, cred: c.cred, src: 'pacote' }); c.img = null; }
      }
      await DB.put('decks', deck.id, { deck, meta: m, em: Date.now() }); BAIXADOS.add(deck.id);
    }
    delete DECKS[deck.id]; STDeck(deck); n++;
  }
  return n;
}
async function enviarArquivo(nome, conteudo, tipo) {
  const file = new File([conteudo], nome, { type: tipo });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: NOME_JOGO, text: 'Abra o arquivo para jogar sem internet.' }); return 'share'; }
  } catch (e) { if (e.name === 'AbortError') return 'cancelado'; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000); return 'download';
}

    $('#p-arq', box).onchange = async e => { const f = e.target.files[0]; if (!f) return; const blob = await reduzir(f); await salvar({ blob, cred: 'Imagem escolhida pelo jogador', src: f.name }); };

    $('#p-rem', box).onclick = async () => { await DB.del('imgs', d.id + '/' + c.n); delete urlCache[d.id + '/' + c.n]; toast('Imagem removida'); fecharModal(); if (TELA === 'coletor') telaColetor(); };
    buscar();
  });
}
function reduzir(file, w = 600) {
  return new Promise(res => {
    const im = new Image(); im.onload = () => {
      const s = Math.min(1, w / im.width); const cv = document.createElement('canvas'); cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); cv.toBlob(b => res(b || file), 'image/jpeg', .82);
    }; im.onerror = () => res(file); im.src = URL.createObjectURL(file);
  });
}
/* ZIP simples (sem compressao) para exportar as imagens escolhidas */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files) { // [{name, data:Uint8Array}]
  const enc = new TextEncoder(); const parts = [], central = []; let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm); off += 30 + nm.length + sz;
  }
  const csz = central.reduce((s, p) => s + p.length, 0);
  const e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csz, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' });
}
async function exportarZip(d) {
  const files = [], linhas = ['id;nome;arquivo;credito;licenca;origem'];
  for (const c of d.cards) {
    const r = await DB.get('imgs', d.id + '/' + c.n).catch(() => null); if (!r || !r.blob) continue;
    const ext = (r.blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
    const nome = `${d.id}/${String(c.n).padStart(3, '0')}.${ext}`;
    files.push({ name: nome, data: new Uint8Array(await r.blob.arrayBuffer()) });
    linhas.push([c.n, c.nome, nome, r.cred || '', r.lic || '', r.src || ''].map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';'));
  }
  if (!files.length) return toast('Nenhuma imagem guardada neste baralho ainda. Baixe o baralho ou escolha imagens primeiro.');
  files.push({ name: `${d.id}/FONTES_E_LICENCAS.csv`, data: new TextEncoder().encode('﻿' + linhas.join('\r\n')) });
  await enviarArquivo(`imagens_${d.id}.zip`, zip(files), 'application/zip');
}
